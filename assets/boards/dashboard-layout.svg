<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2F6BFF"/></marker></defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="72" y="82" font-family="PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#111111">更丰富的仪表盘，顶部放每日改写的总结</text>
  <text x="72" y="120" font-family="PingFang SC, sans-serif" font-size="18" fill="#666666">约 15 个组件 · 顶部总结每天覆盖 · 全部来自去标识化汇总字段</text>

  <!-- pinned summary text block -->
  <g font-family="PingFang SC, sans-serif">
    <rect x="72" y="156" width="1056" height="120" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/>
    <text x="96" y="196" font-size="22" font-weight="700" fill="#111111">最近总结 · 近 14 个工作日</text>
    <text x="96" y="228" font-size="16" fill="#444444">整体平稳，后半段强度略升；连接感偏高、精力偏低。</text>
    <text x="96" y="254" font-size="14" fill="#999999">文本信号，非心理测评 · 每日 +dashboard-block-update 幂等改写</text>
    <text x="1104" y="196" font-size="13" fill="#2F6BFF" text-anchor="end">置顶</text>
  </g>

  <!-- four component groups feeding the summary -->
  <g font-family="PingFang SC, sans-serif" text-anchor="middle">
    <g><rect x="72" y="360" width="230" height="150" rx="16" fill="#F5F7FA" stroke="#111111"/><text x="187" y="405" font-size="20" font-weight="600">指标卡 ×4</text><text x="187" y="435" font-size="14" fill="#777777">天数·置信度</text><text x="187" y="457" font-size="14" fill="#777777">强度·帮助程度</text></g>
    <g><rect x="347" y="360" width="230" height="150" rx="16" fill="#F5F7FA" stroke="#111111"/><text x="462" y="405" font-size="20" font-weight="600">趋势 ×4</text><text x="462" y="435" font-size="14" fill="#777777">强度×置信度组合</text><text x="462" y="457" font-size="14" fill="#777777">活跃度·表情</text></g>
    <g><rect x="622" y="360" width="230" height="150" rx="16" fill="#F5F7FA" stroke="#111111"/><text x="737" y="405" font-size="20" font-weight="600">分布 ×4</text><text x="737" y="435" font-size="14" fill="#777777">主情绪·覆盖</text><text x="737" y="457" font-size="14" fill="#777777">表情·校准</text></g>
    <g><rect x="897" y="360" width="231" height="150" rx="16" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="1012" y="405" font-size="20" font-weight="600">六维雷达</text><text x="1012" y="435" font-size="14" fill="#777777">文本状态轮廓</text><text x="1012" y="457" font-size="14" fill="#777777">非心理测评</text></g>
  </g>

  <!-- dashed arrows: components roll up into the pinned summary -->
  <g stroke="#2F6BFF" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)" fill="none">
    <path d="M187 356 C187 320 300 300 400 282"/>
    <path d="M462 356 C462 328 500 300 540 282"/>
    <path d="M737 356 C737 328 700 300 660 282"/>
    <path d="M1012 356 C1012 320 900 300 800 282"/>
  </g>

  <text x="72" y="600" font-family="PingFang SC, sans-serif" font-size="15" fill="#999999">聚合口径：summarize_window.py 只出数字与标签；叙事经 validate_summary.py 校验，禁诊断词、强制免责。</text>
  <text x="72" y="632" font-family="PingFang SC, sans-serif" font-size="15" fill="#999999">用户填写型字段（帮助程度、用户校准）初期偏空，随使用积累，属预期。</text>
</svg>
