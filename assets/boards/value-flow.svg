    <g><rect x="82" y="270" width="190" height="120" rx="18" fill="#F5F7FA" stroke="#111111"/><text x="177" y="324" font-size="23" font-weight="600">本人消息</text><text x="177" y="356" font-size="16" fill="#777777">当天 · 工作日</text></g>
    <g><rect x="312" y="270" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="3"/><text x="407" y="324" font-size="23" font-weight="600">证据门</text><text x="407" y="356" font-size="16" fill="#777777">不足就停止</text></g>
    <g><rect x="542" y="270" width="190" height="120" rx="18" fill="#F5F7FA" stroke="#111111"/><text x="637" y="324" font-size="23" font-weight="600">文本假设</text><text x="637" y="356" font-size="16" fill="#777777">含置信度</text></g>
    <g><rect x="772" y="270" width="190" height="120" rx="18" fill="#F5F7FA" stroke="#111111"/><text x="867" y="324" font-size="23" font-weight="600">微小支持</text><text x="867" y="356" font-size="16" fill="#777777">具体 · 可拒绝</text></g>
    <g><circle cx="1070" cy="330" r="74" fill="#2F6BFF"/><text x="1070" y="325" font-size="23" font-weight="700" fill="#FFFFFF">用户校准</text><text x="1070" y="355" font-size="16" fill="#FFFFFF">最终解释权</text></g>
  </g>
  <g stroke="#2F6BFF" stroke-width="3" marker-end="url(#arrow)"><line x1="272" y1="330" x2="302" y2="330"/><line x1="502" y1="330" x2="532" y2="330"/><line x1="732" y1="330" x2="762" y2="330"/><line x1="962" y1="330" x2="984" y2="330"/></g>
  <path d="M1070 420 C1070 535 640 550 640 404" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
