  <text x="72" y="120" font-family="PingFang SC, sans-serif" font-size="18" fill="#666666">原文不落库 · 结论可修正 · 每次只给一个小行动</text>
  <line x1="200" y1="330" x2="1000" y2="330" stroke="#D9DDE5" stroke-width="3"/>
